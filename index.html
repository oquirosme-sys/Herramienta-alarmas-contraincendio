<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baterías de alarma — Memoria de cálculo</title>
  <meta name="description" content="Cálculo de baterías secundarias, fuentes auxiliares y caída de tensión para sistemas de detección y alarma contra incendio según NFPA 72:2022.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Capas del Suite, en orden: 1 sistema · 2 quién soy · 3 de qué estoy hecho · 4 cómo me organizo -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/suite-color.css">
  <link rel="stylesheet" href="css/suite-mac.css">
  <link rel="stylesheet" href="css/suite-app.css">
</head>
<body data-app="alarmas-ci">
  <header class="barra vidrio" id="topbar">
    <div class="barra-in">
      <a class="volver-suite" id="volverSuite" href="#">← Suite</a>
      <div class="app-id">
        <span class="tesela" aria-hidden="true">
          <!-- glifo: campana de alarma con ondas de sonido -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4.2a5 5 0 0 0-5 5v3.1L5.4 15.4h13.2L17 12.3V9.2a5 5 0 0 0-5-5z"/>
            <path d="M10.2 18.2a1.9 1.9 0 0 0 3.6 0"/>
            <path d="M3.4 8.6a8.6 8.6 0 0 1 2.2-4M20.6 8.6a8.6 8.6 0 0 0-2.2-4" stroke-width="1.4" opacity=".7"/>
          </svg>
        </span>
        <div>
          <h1 class="app-nombre">Alarma contra incendio</h1>
          <div class="app-sub">Baterías y caída de tensión · NFPA 72:2022</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="toolbar">
        <label class="field" style="flex-direction:row;align-items:center;gap:6px">
          <span>Proyecto</span>
          <select id="selProyecto" title="Proyecto activo" aria-label="Proyecto abierto"></select>
        </label>
        <div class="menu">
          <button class="btn" id="btnMenuProyecto" aria-haspopup="true">Proyecto ▾</button>
          <div class="menu-list" id="menuProyecto" hidden>
            <button data-accion="nuevo">Nuevo proyecto</button>
            <button data-accion="ejemplo">Nuevo proyecto de ejemplo (del Excel)</button>
            <button data-accion="duplicar">Duplicar proyecto</button>
            <button data-accion="exportar">Exportar proyecto (.json)</button>
            <button data-accion="importar">Importar proyecto (.json)</button>
            <hr>
            <button data-accion="eliminar" class="danger">Eliminar proyecto</button>
          </div>
        </div>
        <button class="btn admin" id="btnAdmin" title="Modo administrador">
          <span aria-hidden="true">🔒</span> <span id="lblAdmin">Administrador</span>
        </button>
      </div>
      <div class="save-state" id="estadoGuardado" title="Los datos se guardan en este navegador">● Guardado</div>
    </div>
    <div class="barra-in barra-secciones">
      <nav class="secciones" id="tabs" role="tablist" aria-label="Secciones"></nav>
    </div>
  </header>

  <main id="vista" class="pagina"></main>

  <footer class="pie">
    Criterio: NFPA 72:2022 §10.6.7 · UL 864 · NEC Art. 760. Corrientes y resistencias de fichas de fabricante:
    verificar contra la revisión vigente antes de construcción. Aprobación final: AHJ.
  </footer>

  <!-- Diálogo genérico -->
  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h3 id="dlgTitulo"></h3>
      <div id="dlgCuerpo"></div>
      <div class="dlg-acciones">
        <button value="ok" class="btn primary" id="dlgOk">Aceptar</button>
        <button value="cancel" class="btn ghost" id="dlgCancelar" formnovalidate>Cancelar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/catalogo-base.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
